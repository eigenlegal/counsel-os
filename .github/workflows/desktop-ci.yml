name: Desktop qualification

on:
  pull_request:
  push:
    branches: [main, work/standalone-desktop]
  workflow_dispatch:
  workflow_call:
    inputs:
      retain_local_test_image:
        description: Retain the ad-hoc local-test image as a short-lived Actions artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS arm64 app and workers
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify host and install locked dependencies
        run: |
          test "$(uname -m)" = arm64
          bun install --frozen-lockfile
          (cd runtime/ui && bun install --frozen-lockfile)
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
      - name: Source checks (no provider account)
        run: |
          bun run repo:check
          bun run typecheck:runtime
          bun run typecheck:ui
          bun test runtime/src/workspace runtime/src/docx scripts/build_workspace.test.ts scripts/build_desktop.test.ts scripts/package_desktop.test.ts scripts/desktop_release.test.ts scripts/repository_policy.test.ts
          bun run ui:test
      - name: Build the current workspace and desktop shell
        run: bun run desktop:build --outdir "$RUNNER_TEMP/counsel-desktop-build"
      - name: Qualify relocated engine, documents and browser recovery
        run: bun e2e/workspace-package-check.ts "$RUNNER_TEMP/counsel-desktop-build/Counsel.app" --browser-python "$(command -v python)"
      - name: Qualify actual native WebKit and app lifecycle
        run: bun e2e/workspace-desktop-check.ts "$RUNNER_TEMP/counsel-desktop-build/Counsel.app"
      - name: Build and verify local-test disk image (never a release)
        run: bun run desktop:package --app "$RUNNER_TEMP/counsel-desktop-build/Counsel.app" --outdir "$RUNNER_TEMP/counsel-desktop-package"
      # Do not upload synthetic databases, bootstrap URLs, raw logs, or signing material.
      # Pull requests and ordinary pushes never retain an app image.
      - name: Retain local-test image and hash receipts
        if: ${{ inputs.retain_local_test_image == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Counsel-local-test-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/counsel-desktop-package/Counsel-local-test-arm64.dmg
            ${{ runner.temp }}/counsel-desktop-package/package.json
            ${{ runner.temp }}/counsel-desktop-package/desktop-build.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
