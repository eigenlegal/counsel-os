name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - work/standalone-desktop

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Python test tooling
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repository file policy
        run: bun run repo:check

      - name: Build UI
        run: bun run ui:build

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck runtime
        run: bun run typecheck:runtime

      - name: Typecheck UI
        run: bun run typecheck:ui

      - name: Test
        run: bun run test

      - name: UI tests
        run: bun run ui:test

      - name: Eval scorer self-test
        run: bun run evals:self-test

      - name: Eval runner tests (scorers, runner, parity with the saved baseline)
        run: bun run evals:runner-test

      - name: Law frontmatter warnings
        run: bun run law:frontmatter

      - name: Knowledge conventions + manifest version sync
        run: python3 scripts/lint_knowledge.py --check-versions

      - name: Browse command reference drift
        run: |
          python3 scripts/gen_browse_reference.py
          git diff --exit-code skills/browse/SKILL.md

      - name: Script syntax (python + shell)
        run: |
          python3 -m py_compile scripts/*.py
          for f in scripts/*.sh backup restore setup update; do bash -n "$f"; done
