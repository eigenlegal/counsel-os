name: Desktop signed test (owner approval required)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-signing
  cancel-in-progress: false

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    environment: counsel-desktop-signing
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require the owner-confirmed identity before accessing signing material
        env:
          COUNSEL_SIGNING_READY: ${{ vars.COUNSEL_SIGNING_READY }}
          COUNSEL_SIGNING_IDENTITY: ${{ vars.COUNSEL_SIGNING_IDENTITY }}
        run: |
          test "$COUNSEL_SIGNING_READY" = true
          bun install --frozen-lockfile
          (cd runtime/ui && bun install --frozen-lockfile)
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
          bun -e 'import {validateSigningIdentity} from "./scripts/sign_desktop"; import identity from "./desktop/release-identity.json"; validateSigningIdentity(identity, process.env.COUNSEL_SIGNING_IDENTITY ?? "")'
      - name: Test and build without provider or signing credentials
        run: |
          bun run typecheck:runtime
          bun run typecheck:ui
          bun run test
          bun run ui:test
          bun run desktop:build --outdir "$RUNNER_TEMP/counsel-signing-input"
      - name: Sign and notarize a separate test image
        env:
          COUNSEL_CERTIFICATE_BASE64: ${{ secrets.COUNSEL_CERTIFICATE_BASE64 }}
          COUNSEL_CERTIFICATE_PASSWORD: ${{ secrets.COUNSEL_CERTIFICATE_PASSWORD }}
          COUNSEL_APPLE_ID: ${{ secrets.COUNSEL_APPLE_ID }}
          COUNSEL_NOTARY_PASSWORD: ${{ secrets.COUNSEL_NOTARY_PASSWORD }}
          COUNSEL_SIGNING_IDENTITY: ${{ vars.COUNSEL_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          SIGNING_KEYCHAIN="$RUNNER_TEMP/counsel-signing.keychain-db"
          SIGNING_CERTIFICATE="$RUNNER_TEMP/counsel-signing.p12"
          SIGNING_PASSWORD="$(openssl rand -hex 32)"
          trap 'security delete-keychain "$SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; rm -f "$SIGNING_CERTIFICATE"' EXIT
          printf '%s' "$COUNSEL_CERTIFICATE_BASE64" | base64 --decode > "$SIGNING_CERTIFICATE"
          chmod 600 "$SIGNING_CERTIFICATE"
          security create-keychain -p "$SIGNING_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$SIGNING_CERTIFICATE" -P "$COUNSEL_CERTIFICATE_PASSWORD" -k "$SIGNING_KEYCHAIN" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_PASSWORD" "$SIGNING_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          security default-keychain -d user -s "$SIGNING_KEYCHAIN"
          SIGNING_TEAM="$(bun -e 'import i from "./desktop/release-identity.json"; console.log(i.teamId)')"
          xcrun notarytool store-credentials counsel-notary --apple-id "$COUNSEL_APPLE_ID" --team-id "$SIGNING_TEAM" --password "$COUNSEL_NOTARY_PASSWORD" --keychain "$SIGNING_KEYCHAIN" >/dev/null
          bun scripts/sign_desktop.ts --app "$RUNNER_TEMP/counsel-signing-input/Counsel OS.app" --outdir "$RUNNER_TEMP/counsel-signed-test" --identity "$COUNSEL_SIGNING_IDENTITY" --notary-profile counsel-notary
      - name: Qualify signed nested engine and native shell without live accounts
        run: |
          bun e2e/workspace-package-check.ts "$RUNNER_TEMP/counsel-signed-test/Counsel OS.app" --browser-python "$(command -v python)"
          bun e2e/workspace-desktop-check.ts "$RUNNER_TEMP/counsel-signed-test/Counsel OS.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Counsel-OS-signed-test-${{ github.sha }}
          path: |
            ${{ runner.temp }}/counsel-signed-test/Counsel-OS-signed-test-arm64.dmg
            ${{ runner.temp }}/counsel-signed-test/signed-test.json
            ${{ runner.temp }}/counsel-signed-test/desktop-build.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
